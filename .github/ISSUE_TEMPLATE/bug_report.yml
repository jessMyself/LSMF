name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include private system data here. Use the Security tab instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or package version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Disposable-system reproduction
      description: Provide minimal steps and state whether a VM or mock was used.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Sanitized evidence
      description: Remove usernames, paths, addresses, hostnames, tokens, and machine identifiers.
