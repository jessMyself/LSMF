LSMF_VERSION="1.0.0"

ENABLED_MODULES="ssh_hardening firewall_hardening network_hardening kernel_hardening"

DISABLE_IPV6="false"

FIREWALL_ENABLED="true"

SSH_HARDENING="true"
SSH_PERMIT_ROOT_LOGIN="no"
SSH_PASSWORD_AUTH="yes"

NETWORK_HARDENING="true"

KERNEL_HARDENING="true"

MAC_SYSTEM="apparmor"

AUTOMATIC_UPDATES="true"

BACKUP_ENABLED="true"
BACKUP_RETENTION_DAYS="30"

LOGGING_LEVEL="INFO"
LOGGING_VERBOSE="false"

REPORT_FORMATS="txt json html"

INTERACTIVE_MODE="true"

DRY_RUN="false"

ROLLBACK_ENABLED="true"
